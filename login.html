<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Red Wisdom</title>
    <meta name="description" content="登录 Red Wisdom，同步毛选问答、实践和复盘档案。">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="assets/tailwind.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-warm-rice min-h-[100dvh] text-ink-black font-serif">
    <header class="bg-china-red text-warm-rice px-5 py-4 shadow">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <a href="index.html" class="font-mao text-2xl">Red Wisdom</a>
            <nav class="flex items-center gap-3 text-sm" aria-label="主导航">
                <a class="hover:underline" href="reading.html">阅读</a>
                <a class="hover:underline" href="chat.html">问道</a>
                <a class="hover:underline" href="practice.html">实践</a>
                <a class="hover:underline" href="me.html">我的</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 pb-24">
        <section class="mb-6 max-w-3xl">
            <p class="text-sm text-china-red font-bold mb-2">账户与同步</p>
            <h1 class="font-mao text-4xl text-china-red mb-2">Red Wisdom 账户</h1>
            <p class="text-gray-700 leading-relaxed">登录后，当前浏览器的学习档案会与个人云端档案合并。</p>
        </section>

        <section class="grid md:grid-cols-[1.1fr_0.9fr] gap-4">
            <div class="bg-white/85 border border-dark-beige/50 rounded-lg p-5">
                <h2 class="font-mao text-2xl text-china-red mb-3">登录状态</h2>
                <div id="authState" role="status" aria-live="polite"
                    class="mb-4 rounded border border-dark-beige/60 bg-warm-rice/70 p-4 text-sm leading-relaxed">
                    正在检查登录状态...
                </div>

                <div id="profilePanel" class="hidden mb-4 rounded border border-red-100 bg-red-50 p-4">
                    <div class="flex items-center gap-3">
                        <img id="avatarImage" class="hidden h-12 w-12 rounded-full object-cover" alt="用户头像" referrerpolicy="no-referrer">
                        <div>
                            <p id="displayName" class="font-bold text-china-red"></p>
                            <p id="emailText" class="text-sm text-gray-600"></p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3">
                    <button id="googleLoginBtn"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-china-red text-warm-rice rounded hover:bg-red-800 disabled:cursor-not-allowed disabled:opacity-50"
                        type="button">
                        <span class="flex h-5 w-5 items-center justify-center rounded-full bg-white text-xs font-bold text-china-red" aria-hidden="true">G</span>
                        使用 Google 登录
                    </button>
                    <button id="syncNowBtn"
                        class="hidden px-4 py-2 bg-china-red text-warm-rice rounded hover:bg-red-800 disabled:cursor-not-allowed disabled:opacity-50"
                        type="button">立即同步</button>
                    <a id="continueBtn" href="me.html"
                        class="hidden px-4 py-2 border border-china-red text-china-red rounded hover:bg-red-50">继续</a>
                    <button id="signOutBtn"
                        class="hidden px-4 py-2 border border-dark-beige rounded hover:bg-dark-beige/20"
                        type="button">
                        退出此浏览器
                    </button>
                    <a href="me.html" class="px-4 py-2 border border-dark-beige rounded hover:bg-dark-beige/20">
                        我的档案
                    </a>
                </div>
            </div>

            <div class="bg-white/80 border border-dark-beige/50 rounded-lg p-5">
                <h2 class="font-mao text-2xl text-china-red mb-3">学习档案</h2>
                <div id="localArchiveStatus" class="mb-4 rounded border border-red-100 bg-red-50 p-4 text-sm leading-relaxed"></div>
                <div id="syncState" role="status" aria-live="polite"
                    class="mb-4 rounded border border-dark-beige/60 bg-warm-rice/70 p-3 text-sm text-gray-700">
                    登录后开始完整学习档案云端同步。
                </div>
                <div id="setupHint" class="mt-4 rounded border border-dark-beige/60 bg-warm-rice/70 p-3 text-sm text-gray-700">
                    Supabase 未配置时，网站保持本机私密模式。
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed inset-x-0 bottom-0 z-40 border-t border-dark-beige/60 bg-warm-rice/95 pb-[calc(0.35rem+env(safe-area-inset-bottom))] shadow-[0_-8px_24px_rgba(0,0,0,0.08)] backdrop-blur md:hidden" aria-label="移动端主导航">
        <div class="mx-auto grid max-w-md grid-cols-5">
            <a href="index.html" class="flex min-h-[64px] items-center justify-center text-sm text-ink-black/70">抽卡</a>
            <a href="reading.html" class="flex min-h-[64px] items-center justify-center text-sm text-ink-black/70">阅读</a>
            <a href="chat.html" class="flex min-h-[64px] items-center justify-center text-sm text-ink-black/70">问道</a>
            <a href="practice.html" class="flex min-h-[64px] items-center justify-center text-sm text-ink-black/70">实践</a>
            <a href="me.html" aria-current="page" class="flex min-h-[64px] items-center justify-center text-sm font-bold text-china-red">我的</a>
        </div>
    </nav>

    <script src="config.js?v=7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
    <script src="js/auth-utils.js"></script>
    <script src="js/cloud-sync.js"></script>
    <script src="js/auto-sync.js"></script>
    <script src="js/register-pwa.js?v=4"></script>
    <script src="js/practice-store.js"></script>
    <script src="js/problem-case-store.js"></script>
    <script src="js/conversation-store.js"></script>
    <script src="js/reading-notes-store.js"></script>
    <script src="js/reading-progress-store.js"></script>
    <script src="js/saved-quotes-store.js"></script>
    <script src="js/saved-answers-store.js"></script>
    <script>
        const authState = document.getElementById('authState');
        const localArchiveStatus = document.getElementById('localArchiveStatus');
        const syncState = document.getElementById('syncState');
        const profilePanel = document.getElementById('profilePanel');
        const avatarImage = document.getElementById('avatarImage');
        const displayName = document.getElementById('displayName');
        const emailText = document.getElementById('emailText');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const syncNowBtn = document.getElementById('syncNowBtn');
        const continueBtn = document.getElementById('continueBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const setupHint = document.getElementById('setupHint');
        const practiceStore = window.RedWisdomPractice.createPracticeStore(localStorage);
        const problemCaseStore = window.RedWisdomProblemCases.createProblemCaseStore(localStorage);
        const conversationStore = window.RedWisdomConversations.createConversationStore(localStorage);
        const readingNotesStore = window.RedWisdomReadingNotes.createReadingNotesStore(localStorage);
        const readingProgressStore = window.RedWisdomReadingProgress.createReadingProgressStore(localStorage);
        const savedQuotesStore = window.RedWisdomSavedQuotes.createSavedQuotesStore(localStorage);
        const savedAnswersStore = window.RedWisdomSavedAnswers.createSavedAnswersStore(localStorage);
        const returnTo = window.RedWisdomAuth.getSafeReturnTo(new URLSearchParams(window.location.search).get('next'), window.location.origin);
        const callbackError = window.RedWisdomAuth.getAuthCallbackError(window.location);
        let authClient = null;
        let authStatus = { configured: false, missing: [] };
        let googleAuthEnabled = false;
        let currentProfile = null;
        let activeSyncUserId = '';
        let autoSyncController = null;
        let unsubscribeAuth = () => {};
        let sessionTask = Promise.resolve();

        continueBtn.href = returnTo;

        googleLoginBtn.addEventListener('click', async () => {
            googleLoginBtn.disabled = true;
            authState.textContent = '正在跳转到 Google 登录...';

            try {
                const redirectTo = window.RedWisdomAuth.buildLoginCallbackUrl(window.location.href, returnTo);
                await window.RedWisdomAuth.signInWithGoogle(authClient, redirectTo);
            } catch (error) {
                googleLoginBtn.disabled = false;
                authState.textContent = error.message || '登录失败，请稍后重试。';
            }
        });

        signOutBtn.addEventListener('click', async () => {
            signOutBtn.disabled = true;
            try {
                stopSignedInSync();
                await window.RedWisdomAuth.signOut(authClient);
                await handleSession(null, 'SIGNED_OUT');
            } catch (error) {
                authState.textContent = error.message || '退出失败，请稍后重试。';
            } finally {
                signOutBtn.disabled = false;
            }
        });

        syncNowBtn.addEventListener('click', async () => {
            if (!autoSyncController) return;
            syncNowBtn.disabled = true;
            await autoSyncController.run(true);
            syncNowBtn.disabled = false;
        });

        async function initAuth() {
            await Promise.resolve(window.REDWISDOM_CONFIG_READY).catch(() => CONFIG);
            const authConfig = typeof CONFIG !== 'undefined' ? CONFIG : {};
            authStatus = window.RedWisdomAuth.getAuthConfigStatus(authConfig);
            googleAuthEnabled = authConfig.SUPABASE_GOOGLE_AUTH_ENABLED === true;
            if (!authStatus.configured) {
                googleLoginBtn.disabled = true;
                authState.textContent = `账户服务尚未启用，当前使用本机私密模式。缺少：${authStatus.missing.join('、')}。`;
                syncState.textContent = '本机档案不会丢失，账户配置完成后可再登录合并。';
                setupHint.textContent = '需要在部署环境配置 Supabase URL、Anon Key，并在 Supabase 启用 Google Provider。';
                return;
            }

            authClient = window.RedWisdomAuth.createSupabaseClient(authConfig, window.supabase);
            if (!authClient) {
                googleLoginBtn.disabled = true;
                authState.textContent = 'Supabase SDK 未加载，暂时无法登录。';
                return;
            }

            try {
                unsubscribeAuth = window.RedWisdomAuth.subscribeToAuthChanges(authClient, ({ event, session }) => {
                    queueSession(session, event).catch(error => setSyncError(error));
                });
                const session = await window.RedWisdomAuth.getCurrentSession(authClient);
                await queueSession(session, 'INITIAL_SESSION');
                if (callbackError) setAuthError(callbackError);
            } catch (error) {
                setAuthError(error.message || '无法读取登录状态。');
            }
        }

        function queueSession(session, event) {
            sessionTask = sessionTask.then(() => handleSession(session, event));
            return sessionTask;
        }

        async function handleSession(session, event) {
            const profile = window.RedWisdomAuth.getSessionProfile(session);
            currentProfile = profile;
            renderSession(profile);

            if (!profile) {
                stopSignedInSync();
                return;
            }
            cleanAuthCallbackUrl();
            if (activeSyncUserId === profile.id && autoSyncController) return;
            try {
                await window.RedWisdomAuth.ensureUserProfile(authClient, profile, localStorage.getItem('redwisdom.locale.v1') || 'zh-CN');
            } catch (error) {
                setSyncError(error);
            }
            startSignedInSync(profile, event);
        }

        function renderSession(profile) {
            authState.classList.remove('border-red-200', 'bg-red-50', 'text-red-700');
            if (!profile) {
                profilePanel.classList.add('hidden');
                signOutBtn.classList.add('hidden');
                syncNowBtn.classList.add('hidden');
                continueBtn.classList.add('hidden');
                googleLoginBtn.classList.remove('hidden');
                googleLoginBtn.disabled = !googleAuthEnabled;
                authState.textContent = googleAuthEnabled
                    ? '当前未登录。本机学习档案仍保存在这个浏览器中。'
                    : '账户数据库已连接，Google 登录尚未启用。本机学习档案仍安全保存在这个浏览器中。';
                syncState.textContent = googleAuthEnabled
                    ? '登录后会先合并本机与云端档案，再开启持续同步。'
                    : 'Google Provider 启用后即可登录并开始云端同步。';
                setupHint.textContent = googleAuthEnabled
                    ? '账户服务已连接。登录后，当前浏览器的档案会与个人云端档案合并。'
                    : '还需在 Supabase Authentication > Providers 中配置并启用 Google。';
                return;
            }

            displayName.textContent = profile.displayName;
            emailText.textContent = profile.email;
            if (profile.avatarUrl) {
                avatarImage.src = profile.avatarUrl;
                avatarImage.classList.remove('hidden');
            } else {
                avatarImage.classList.add('hidden');
            }
            profilePanel.classList.remove('hidden');
            signOutBtn.classList.remove('hidden');
            syncNowBtn.classList.remove('hidden');
            continueBtn.classList.remove('hidden');
            googleLoginBtn.classList.add('hidden');
            authState.textContent = '已登录。退出只影响当前浏览器，不会删除本机或云端学习档案。';
        }

        function startSignedInSync(profile, event) {
            stopSignedInSync();
            activeSyncUserId = profile.id;
            autoSyncController = window.RedWisdomAutoSync.startAutoSync({
                client: authClient,
                userId: profile.id,
                storage: localStorage,
                cloudSync: window.RedWisdomCloudSync,
                forceInitial: event === 'SIGNED_IN' || localStorage.getItem(window.RedWisdomAutoSync.SYNCED_USER_KEY) !== profile.id,
                onStatus(detail) {
                    if (detail.state === 'syncing') setSyncMessage('正在合并本机与云端学习档案...');
                    if (detail.state === 'idle') setSyncMessage(`已同步 · ${formatSyncTime(localStorage.getItem(window.RedWisdomAutoSync.LAST_SYNC_KEY))}`);
                    if (detail.state === 'synced') {
                        setSyncMessage(`同步完成 · ${formatSyncTime(detail.result?.syncedAt)}`);
                        renderLocalArchiveSummary();
                    }
                    if (detail.state === 'error') setSyncError(detail.error);
                },
            });
        }

        function stopSignedInSync() {
            autoSyncController?.stop();
            autoSyncController = null;
            activeSyncUserId = '';
        }

        function setAuthError(message) {
            authState.textContent = message;
            authState.classList.add('border-red-200', 'bg-red-50', 'text-red-700');
        }

        function setSyncError(error) {
            syncState.textContent = `已登录，但同步未完成：${error?.message || '请检查数据库表与网络配置。'}`;
            syncState.classList.add('border-red-200', 'bg-red-50', 'text-red-700');
        }

        function setSyncMessage(message) {
            syncState.textContent = message;
            syncState.classList.remove('border-red-200', 'bg-red-50', 'text-red-700');
        }

        function cleanAuthCallbackUrl() {
            const url = new URL(window.location.href);
            ['code', 'error', 'error_code', 'error_description'].forEach(key => url.searchParams.delete(key));
            if (url.hash.includes('access_token') || url.hash.includes('error')) url.hash = '';
            window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
        }

        function formatSyncTime(value) {
            const date = new Date(value || 0);
            return Number.isNaN(date.getTime()) ? '刚刚' : date.toLocaleString('zh-CN', { hour12: false });
        }

        function getLocalArchive() {
            return {
                problemCases: problemCaseStore.listCases(),
                practices: practiceStore.listPractices(),
                conversations: conversationStore.listConversations(),
                readingNotes: readingNotesStore.listNotes(),
                readingProgress: readingProgressStore.listProgress(),
                highlights: readingProgressStore.listHighlights(),
                savedQuotes: savedQuotesStore.listSavedQuotes(),
                savedAnswers: savedAnswersStore.listSavedAnswers(),
            };
        }

        function renderLocalArchiveSummary() {
            const archiveSummary = window.RedWisdomCloudSync.summarizeArchive(getLocalArchive());
            localArchiveStatus.innerHTML = `
                <p class="text-gray-700">${archiveSummary.hasRecords ? '当前浏览器已有可同步记录。' : '当前浏览器还没有学习档案记录。'}</p>
                <p class="mt-2 text-gray-600">${escapeHtml(archiveSummary.statusText)}</p>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        renderLocalArchiveSummary();
        initAuth();
        window.addEventListener('pagehide', () => {
            unsubscribeAuth();
            stopSignedInSync();
        }, { once: true });
    </script>
</body>

</html>
