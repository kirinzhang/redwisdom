<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问道毛选 - AI智能对话 | Red Wisdom</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="基于毛泽东选集的AI智能助手，用毛主席的思想方法帮你分析问题，给出具有战略高度的建议。">
    <meta name="keywords" content="毛选AI,毛泽东思想,智能对话,人生建议,战略思维">
    <meta name="author" content="Red Wisdom">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="问道毛选 - AI智能对话">
    <meta property="og:description" content="用毛主席的思想方法帮你分析问题，给出具有战略高度的建议。">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'warm-rice': '#F7F4ED',
                        'china-red': '#BC2D22',
                        'ink-black': '#2B2B2B',
                        'dark-beige': '#D6C6B0',
                    },
                    fontFamily: {
                        'mao': ['"Ma Shan Zheng"', 'cursive'],
                        'serif': ['"Noto Serif SC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .typing-cursor::after {
            content: '▌';
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .message-content blockquote {
            border-left: 3px solid #BC2D22;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #5a5a5a;
            font-style: italic;
        }

        .message-content strong {
            color: #BC2D22;
        }

        .message-content ul,
        .message-content ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }

        .message-content li {
            margin: 0.25rem 0;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scroll-smooth {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-warm-rice min-h-[100dvh] w-screen flex flex-col">

    <!-- Header -->
    <header class="bg-china-red text-warm-rice py-4 px-6 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-warm-rice/80 hover:text-warm-rice transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </a>
                <h1 class="font-mao text-2xl md:text-3xl">问道毛选</h1>
            </div>
            <p class="text-sm opacity-80 hidden md:block">以毛主席的思想方法，解答你的困惑</p>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-hidden flex flex-col max-w-4xl mx-auto w-full">

        <!-- Messages Area -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth">
            <!-- Welcome Message -->
            <div class="flex gap-3 fade-in">
                <div class="w-10 h-10 rounded-full bg-china-red flex items-center justify-center flex-shrink-0">
                    <span class="text-warm-rice font-mao text-lg">毛</span>
                </div>
                <div class="flex-1 bg-white rounded-2xl rounded-tl-sm p-4 shadow-sm max-w-[85%]">
                    <p class="font-serif text-ink-black leading-relaxed">
                        同志，你好！
                    </p>
                    <p class="font-serif text-ink-black leading-relaxed mt-2">
                        我是根据《毛泽东选集》训练的智能助手。你有什么困惑、焦虑，或者工作生活中遇到的问题，都可以跟我说说。
                    </p>
                    <p class="font-serif text-ink-black leading-relaxed mt-2">
                        我会用毛主席的思想方法来帮你分析问题，给你一些参考意见。记住：<strong>实践是检验真理的唯一标准</strong>！
                    </p>
                </div>
            </div>
            <div id="promptChips" class="px-4 pb-2 flex flex-wrap gap-2">
                <button data-prompt="我最近很焦虑，事情太多，不知道先做什么" class="prompt-chip px-3 py-2 rounded-full border border-china-red/30 text-china-red bg-white/70 font-serif text-sm">我最近很焦虑</button>
                <button data-prompt="工作推进不下去，感觉大家都不配合" class="prompt-chip px-3 py-2 rounded-full border border-china-red/30 text-china-red bg-white/70 font-serif text-sm">工作推进不下去</button>
                <button data-prompt="我被批评后很受挫，开始怀疑自己" class="prompt-chip px-3 py-2 rounded-full border border-china-red/30 text-china-red bg-white/70 font-serif text-sm">被批评后很受挫</button>
                <button data-prompt="我想开始行动，但总是想太多" class="prompt-chip px-3 py-2 rounded-full border border-china-red/30 text-china-red bg-white/70 font-serif text-sm">如何开始行动</button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="border-t border-dark-beige/30 bg-warm-rice p-4">
            <div class="flex gap-3 max-w-4xl mx-auto">
                <textarea id="userInput" placeholder="说说你的困惑..."
                    class="flex-1 resize-none rounded-xl border-2 border-dark-beige/50 focus:border-china-red focus:ring-0 p-3 font-serif text-ink-black placeholder:text-dark-beige/70 transition-colors"
                    rows="2"></textarea>
                <button id="sendBtn" disabled
                    class="px-6 py-3 bg-china-red text-warm-rice font-mao text-xl rounded-xl hover:bg-red-800 transition-all duration-300 shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    <span>加载中</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                    </svg>
                </button>
            </div>
            <p class="text-center text-xs text-dark-beige/70 mt-2">
                回答仅供参考，基于毛选文章生成 ·
                <a href="reading.html" class="text-china-red hover:underline">阅读原著</a>
            </p>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="retrieval.js"></script>
    <script>
        // ===== 配置 =====
        const CHAT_API_URL = CONFIG.WORKER_URL || '/api/chat';
        const MODEL = CONFIG.MODEL;

        function getApiUrl() {
            return CHAT_API_URL;
        }

        // ===== DOM 元素 =====
        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sendBtnLabel = sendBtn.querySelector('span');

        // ===== 状态 =====
        let conversationHistory = [];
        let isGenerating = false;
        let isKnowledgeBaseLoading = true;
        let knowledgeBaseError = null;
        let maoSkills = [];
        let searchChunks = [];

        async function loadKnowledgeBase() {
            const [skillsResponse, indexResponse] = await Promise.all([
                fetch('data/mao-skills.json'),
                fetch('data/search-index.json')
            ]);
            if (!skillsResponse.ok) throw new Error('无法加载毛选方法 skills');
            if (!indexResponse.ok) throw new Error('无法加载毛选检索索引');
            maoSkills = await skillsResponse.json();
            const index = await indexResponse.json();
            searchChunks = index.chunks || [];
        }

        // ===== 消息渲染 =====
        function addUserMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-3 justify-end fade-in';
            messageDiv.innerHTML = `
                <div class="bg-china-red text-warm-rice rounded-2xl rounded-tr-sm p-4 shadow-sm max-w-[85%]">
                    <p class="font-serif leading-relaxed">${escapeHtml(text)}</p>
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function addAssistantMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-3 fade-in';
            messageDiv.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-china-red flex items-center justify-center flex-shrink-0">
                    <span class="text-warm-rice font-mao text-lg">毛</span>
                </div>
                <div class="flex-1 bg-white rounded-2xl rounded-tl-sm p-4 shadow-sm max-w-[85%]">
                    <div class="message-content font-serif text-ink-black leading-relaxed typing-cursor"></div>
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
            return {
                wrapper: messageDiv,
                content: messageDiv.querySelector('.message-content')
            };
        }

        function updateAssistantMessage(content, element) {
            element.innerHTML = sanitizeHtml(marked.parse(content));
            scrollToBottom();
        }

        function finalizeAssistantMessage(element) {
            element.classList.remove('typing-cursor');
        }

        function renderSkillCards(skills) {
            return `
                <div class="mt-3 grid gap-2">
                    ${skills.map(skill => `
                        <div class="rounded-lg border border-china-red/20 bg-warm-rice/70 p-3">
                            <div class="font-mao text-lg text-china-red">${escapeHtml(skill.name)}</div>
                            <p class="font-serif text-sm text-ink-black/75">${escapeHtml(skill.summary)}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderCitationCards(chunks) {
            return `
                <div class="mt-3 space-y-2">
                    ${chunks.map(chunk => `
                        <a href="${RedWisdomRetrieval.articleUrl(chunk.filename, chunk.title)}" class="block rounded-lg border border-dark-beige/60 bg-warm-rice/80 p-3 hover:border-china-red transition">
                            <div class="font-serif font-bold text-china-red">《${escapeHtml(chunk.title)}》</div>
                            <p class="mt-1 font-serif text-sm text-ink-black/75 leading-relaxed">${escapeHtml(chunk.excerpt || chunk.text.slice(0, 160))}</p>
                            <span class="mt-2 inline-block text-xs text-china-red">读原文</span>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function addErrorMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-3 fade-in';
            messageDiv.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
                    <span class="text-china-red">⚠️</span>
                </div>
                <div class="flex-1 bg-red-50 rounded-2xl rounded-tl-sm p-4 shadow-sm max-w-[85%] border border-red-200">
                    <p class="font-serif text-red-700 leading-relaxed">${escapeHtml(text)}</p>
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sanitizeHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = html;

            template.content.querySelectorAll('script, iframe, object, embed, link, style, meta, base').forEach((node) => {
                node.remove();
            });

            template.content.querySelectorAll('*').forEach((node) => {
                [...node.attributes].forEach((attribute) => {
                    const name = attribute.name.toLowerCase();
                    const value = attribute.value.trim();

                    if (name.startsWith('on') || name === 'srcdoc') {
                        node.removeAttribute(attribute.name);
                        return;
                    }

                    if ((name === 'href' || name === 'src' || name === 'xlink:href') && /^(javascript|data):/i.test(value)) {
                        node.removeAttribute(attribute.name);
                    }
                });
            });

            return template.innerHTML;
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateInputState() {
            sendBtn.disabled = isGenerating || isKnowledgeBaseLoading || Boolean(knowledgeBaseError);
            userInput.disabled = isGenerating;

            if (isGenerating) {
                sendBtnLabel.textContent = '生成中';
            } else if (isKnowledgeBaseLoading) {
                sendBtnLabel.textContent = '加载中';
            } else if (knowledgeBaseError) {
                sendBtnLabel.textContent = '不可用';
            } else {
                sendBtnLabel.textContent = '发送';
            }
        }

        const knowledgeBasePromise = loadKnowledgeBase()
            .then(() => {
                isKnowledgeBaseLoading = false;
                updateInputState();
            })
            .catch((error) => {
                isKnowledgeBaseLoading = false;
                knowledgeBaseError = error;
                addErrorMessage(`知识库加载失败：${error.message}`);
                updateInputState();
            });

        updateInputState();

        // ===== API 调用 =====
        async function sendMessage(userMessage) {
            isGenerating = true;
            updateInputState();

            let assistantMessage = null;
            let contentElement = null;
            let fullResponse = '';

            try {
                await knowledgeBasePromise;

                if (knowledgeBaseError) {
                    throw new Error(`知识库加载失败：${knowledgeBaseError.message}`);
                }

                const selectedSkills = RedWisdomRetrieval.selectSkills(userMessage, maoSkills, 3);
                const contextChunks = searchChunks.length
                    ? RedWisdomRetrieval.rankChunks(userMessage, selectedSkills, searchChunks, 6)
                    : [];

                addUserMessage(userMessage);

                assistantMessage = addAssistantMessage();
                contentElement = assistantMessage.content;
                const cardsWrapper = document.createElement('div');
                cardsWrapper.innerHTML = renderSkillCards(selectedSkills) + renderCitationCards(contextChunks);
                contentElement.parentElement.appendChild(cardsWrapper);
                const apiUrl = getApiUrl();
                const requestContextChunks = contextChunks.map(({ title, filename, text }) => ({
                    title,
                    filename,
                    text
                }));

                const headers = {
                    'Content-Type': 'application/json'
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        model: MODEL,
                        message: userMessage,
                        history: conversationHistory,
                        selectedSkills,
                        contextChunks: requestContextChunks,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error?.message || error.error || `API 错误: ${response.status}`);
                }

                if (!response.body) {
                    throw new Error('服务器未返回可读取的流式响应，请检查网络环境后重试');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let sseBuffer = '';

                const processSseEvent = (eventText) => {
                    const data = eventText
                        .split('\n')
                        .filter((line) => line.startsWith('data:'))
                        .map((line) => {
                            const value = line.slice(5);
                            return value.startsWith(' ') ? value.slice(1) : value;
                        })
                        .join('\n');

                    if (!data || data === '[DONE]') return;

                    try {
                        const parsed = JSON.parse(data);
                        const content = parsed.choices?.[0]?.delta?.content || '';
                        if (content) {
                            fullResponse += content;
                            updateAssistantMessage(fullResponse, contentElement);
                        }
                    } catch (e) {
                        // Ignore malformed SSE payloads while preserving later complete events.
                    }
                };

                const processCompleteSseEvents = () => {
                    sseBuffer = sseBuffer.replace(/\r\n/g, '\n');
                    const events = sseBuffer.split('\n\n');
                    sseBuffer = events.pop() || '';
                    events.forEach(processSseEvent);
                };

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    sseBuffer += decoder.decode(value, { stream: true });
                    processCompleteSseEvents();
                }

                const finalChunk = decoder.decode();
                if (finalChunk) {
                    sseBuffer += finalChunk;
                    processCompleteSseEvents();
                }

                if (sseBuffer.trim()) {
                    processSseEvent(sseBuffer);
                    sseBuffer = '';
                }

                conversationHistory.push({
                    role: 'user',
                    content: userMessage
                });

                conversationHistory.push({
                    role: 'assistant',
                    content: fullResponse
                });

                finalizeAssistantMessage(contentElement);

            } catch (error) {
                console.error('发送消息失败:', error);

                if (assistantMessage?.wrapper?.isConnected) {
                    assistantMessage.wrapper.remove();
                }

                addErrorMessage(`出了点问题：${error.message}`);
            } finally {
                isGenerating = false;
                updateInputState();
                userInput.focus();
            }
        }

        // ===== 事件处理 =====
        sendBtn.addEventListener('click', () => {
            const message = userInput.value.trim();
            if (message && !sendBtn.disabled) {
                userInput.value = '';
                sendMessage(message);
            }
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        // 自动调整输入框高度
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        const params = new URLSearchParams(window.location.search);
        const presetPrompt = params.get('prompt');
        if (presetPrompt) {
            userInput.value = presetPrompt;
            userInput.focus();
        }

        document.querySelectorAll('.prompt-chip').forEach((button) => {
            button.addEventListener('click', () => {
                userInput.value = button.dataset.prompt;
                userInput.focus();
            });
        });
    </script>
</body>

</html>
