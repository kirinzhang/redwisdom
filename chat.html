    <style>
        /* 生成中：发送按钮变为深色「停止」按钮 */
        #sendBtn.stop-mode {
            background: #2B2B2B;
        }

        #sendBtn.stop-mode:hover {
            background: #a62015;
        }

        .typing-cursor::after {
            content: '▌';
            animation: blink 1s infinite;
        }

        .thinking-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            color: #6B6258;
        }

        .thinking-dots {
            display: inline-flex;
            gap: 0.2rem;
        }

        .thinking-dots span {
            width: 0.32rem;
            height: 0.32rem;
            border-radius: 999px;
            background: #BC2D22;
            animation: thinkingPulse 1.2s ease-in-out infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.16s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.32s;
        }

        @keyframes thinkingPulse {
            0%, 70%, 100% { opacity: 0.28; transform: translateY(0); }
            35% { opacity: 1; transform: translateY(-2px); }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .message-content blockquote {
            border-left: 3px solid #BC2D22;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #5a5a5a;
            font-style: italic;
        }

        .message-content strong {
            color: #BC2D22;
        }

        .message-content ul,
        .message-content ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }

        .message-content li {
            margin: 0.25rem 0;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scroll-smooth {
            scroll-behavior: smooth;
        }

        .history-mirror {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid #D6C6B0;
        }

        .history-mirror__label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            color: #BC2D22;
            font-weight: 700;
        }

        .history-mirror__case {
            padding: 0.9rem 0;
        }

        .history-mirror__case + .history-mirror__case {
            border-top: 1px solid rgba(214, 198, 176, 0.65);
        }

        .history-mirror__title {
            display: block;
            color: #2B2B2B;
            font-weight: 700;
            line-height: 1.55;
        }

        .history-mirror__meta,
        .history-mirror__boundary {
            margin-top: 0.35rem;
            color: #6B6258;
            font-size: 0.8rem;
            line-height: 1.65;
        }

        .history-mirror__method {
            margin-top: 0.55rem;
            color: #2B2B2B;
            font-size: 0.9rem;
            line-height: 1.75;
        }

        .history-mirror__links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            margin-top: 0.65rem;
            font-size: 0.82rem;
        }

        .history-mirror__links a {
            color: #BC2D22;

        }

        @media (max-width: 640px) {
            .history-mirror__label {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.2rem;
            }
        }

        // ===== API 调用 =====
        async function sendMessage(userMessage, options = {}) {
            const requestMode = options.mode === 'guided' ? 'guided' : options.mode === 'direct' ? 'direct' : chatMode;
            const session = getChatSession(requestMode);
            const useWorker = !!WORKER_URL;
            const apiKey = getApiKey();

            // 只有不使用 Worker 时才需要检查 API Key
            if (!useWorker && !apiKey) {
                showApiKeyModal();
                return;
            }

            setChatBusy(true);

            if (options.displayUserMessage !== false) addUserMessage(userMessage, requestMode);

            session.conversationHistory.push({
                role: 'user',
                content: userMessage
            });

            if (!session.activeConversationId) {
                const conversation = conversationStore.createConversation({
                    userMessage,
                    title: options.conversationTitle || userMessage,
                    source: requestMode === 'guided' ? 'guided-chat' : 'chat',
                    problemCaseId,
                });
                session.activeConversationId = conversation.id;
            } else {
                conversationStore.appendMessage(session.activeConversationId, {
                    role: 'user',
                    content: userMessage,
                });
            }

            const contentElement = addAssistantMessage(requestMode);
            let fullResponse = '';
            let finishReason = '';
            const abortController = new AbortController();
            activeAbortController = abortController;
            stoppedByUser = false;
            let inactivityTimeout = null;
            const sourceStatusTimer = window.setTimeout(() => setAssistantStatus(contentElement, 'chat.waiting.sources'), 4000);
            const longStatusTimer = window.setTimeout(() => setAssistantStatus(contentElement, 'chat.waiting.long'), 12000);

            function armInactivityTimeout() {
                window.clearTimeout(inactivityTimeout);
                inactivityTimeout = window.setTimeout(() => abortController.abort(), 90000);
            }

            try {
                armInactivityTimeout();
                const apiUrl = getApiUrl();
                const useWorker = !!WORKER_URL;
                const contextBundle = await buildContextMessageForUser(userMessage);
                const contextMessage = contextBundle.message;
                const localeMessage = window.RedWisdomI18n.createLocaleInstructionMessage(currentLocale);

                const headers = {
                    'Content-Type': 'application/json'
                };

                // 只有直接调用OpenRouter时才需要Authorization
                if (!useWorker) {
                    headers['Authorization'] = `Bearer ${apiKey}`;
                    headers['HTTP-Referer'] = window.location.origin;
                    headers['X-Title'] = 'Red Wisdom Chat';
                }

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(window.RedWisdomAI.buildChatPayload({
                        model: MODEL,
                        contextMessage,
                        localeMessage,
                        conversationHistory: session.conversationHistory,
                        mode: requestMode,
                    })),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error(await readApiErrorMessage(response));
                }

                let streamBuffer = '';

                function processStreamLine(line) {
                    const normalized = line.trim();
                    if (!normalized.startsWith('data:')) return;
                    const data = normalized.slice(5).trim();
                    if (!data || data === '[DONE]') return;
                    try {
                        const parsed = JSON.parse(data);
                        finishReason = parsed.choices?.[0]?.finish_reason || finishReason;
                        const content = parsed.choices?.[0]?.delta?.content || '';
                        if (content) {
                            fullResponse += content;
                            updateAssistantMessage(fullResponse, contentElement, requestMode);
                        }
                    } catch (error) {
                        console.warn('忽略无法解析的流式片段');
                    }
                }

                if (response.body?.getReader) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        armInactivityTimeout();
                        streamBuffer += decoder.decode(value, { stream: true });
                        const lines = streamBuffer.split(/\r?\n/);
                        streamBuffer = lines.pop() || '';
                        lines.forEach(processStreamLine);
                    }
                    streamBuffer += decoder.decode();
                    if (streamBuffer.trim()) processStreamLine(streamBuffer);
                } else {
                    const responseText = await response.text();
                    responseText.split(/\r?\n/).forEach(processStreamLine);
                }

                if (!fullResponse.trim()) {
                    throw new Error(window.RedWisdomI18n.translate(currentLocale, 'chat.error.emptyResponse'));
                }

                session.conversationHistory.push({
                    role: 'assistant',
                    content: fullResponse
                });

                if (session.activeConversationId) {
                    conversationStore.appendMessage(session.activeConversationId, {
                        role: 'assistant',
                        content: fullResponse,
                        methodologyTags: inferMethodologyTags(fullResponse),
                    });
                    recordProblemActivity({
                        type: 'conversation',
                        referenceId: session.activeConversationId,
                        title: userMessage.slice(0, 80),
                        detail: fullResponse.slice(0, 500),
                        sourceHref: `chat.html?case=${encodeURIComponent(problemCaseId)}`,
                    });
                }

                finalizeAssistantMessage(contentElement);
                addHistoryMirror(contentElement, contextBundle.historyCases, contextBundle.classification);
                const answerTags = inferMethodologyTags(fullResponse);
                const answerId = `${session.activeConversationId || requestMode}-assistant-${session.conversationHistory.length - 1}`;
                addPracticeSaveAction(contentElement, {
                    userMessage,
                    assistantMessage: fullResponse,
                });
                addAnswerSaveAction(contentElement, {
                    answerId,
                    conversationId: session.activeConversationId,
                    userMessage,
                    assistantMessage: fullResponse,
                    methodologyTags: answerTags,
                });
                if (finishReason === 'length' || finishReason === 'max_tokens') {
                    addContinueAnswerAction(contentElement, requestMode);
                }

            } catch (error) {
                console.error('发送消息失败:', error);
                const isAbort = error.name === 'AbortError';
                const userStopped = isAbort && stoppedByUser;

                if (userStopped && fullResponse.trim()) {
                    // 用户手动停止且已有部分回答：保留内容，允许继续提问或续写
                    const partial = `${fullResponse}\n\n（回答被手动停止，尚未回答完）`;
                    session.conversationHistory.push({ role: 'assistant', content: partial });
                    updateAssistantMessage(fullResponse, contentElement, requestMode);
                    finalizeAssistantMessage(contentElement);
                    appendStoppedNotice(contentElement);
                    if (session.activeConversationId) {
                        conversationStore.appendMessage(session.activeConversationId, {
                            role: 'assistant',
                            content: partial,
                            methodologyTags: inferMethodologyTags(fullResponse),
                        });
                    }
                    addContinueAnswerAction(contentElement, requestMode);
                } else if (userStopped) {
                    // 还没生成内容就停止：把问题放回输入框，补充完整后再发
                    contentElement.closest('[data-chat-message]')?.remove();
                    session.conversationHistory.pop();
                    userInput.value = userMessage;
                    userInput.style.height = 'auto';
                    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
                    addErrorMessage(window.RedWisdomI18n.translate(currentLocale, 'chat.error.stopped'), requestMode);
                } else {
                    console.error('发送消息失败:', error);

                    contentElement.closest('[data-chat-message]')?.remove();

                    // 从历史中移除失败的消息
                    session.conversationHistory.pop();

                    if (!userInput.value) userInput.value = userMessage;

                    if (isAbort) {
                        addErrorMessage(`${window.RedWisdomI18n.translate(currentLocale, 'chat.error.prefix')}${window.RedWisdomI18n.translate(currentLocale, 'chat.error.timeout')}`, requestMode);
                    } else if (error.message.includes('401') || error.message.includes('Invalid')) {
                        addErrorMessage('API Key 无效，请重新设置。', requestMode);
                        showApiKeyModal();
                    } else {
                        const isNetworkError = error instanceof TypeError && /fetch|network|load/i.test(error.message);
                        const message = isNetworkError
                            ? window.RedWisdomI18n.translate(currentLocale, 'chat.error.network')
                            : error.message;
                        addErrorMessage(`${window.RedWisdomI18n.translate(currentLocale, 'chat.error.prefix')}${message}`, requestMode);
                    }
                }
            } finally {
                activeAbortController = null;
                stoppedByUser = false;
                window.clearTimeout(inactivityTimeout);
                window.clearTimeout(sourceStatusTimer);
                window.clearTimeout(longStatusTimer);
                setChatBusy(false);
                userInput.focus();
            }
        }

        function appendStoppedNotice(element) {
            if (!element) return;
            const notice = document.createElement('p');
            notice.className = 'mt-2 text-xs text-gray-500';
            notice.textContent = window.RedWisdomI18n.translate(currentLocale, 'chat.stoppedNotice');
            element.appendChild(notice);
        }

        async function readApiErrorMessage(response) {
            let payload = null;
            try {
                payload = await response.json();
            } catch (error) {
                // Non-JSON errors still receive a useful status message below.
            }
            if (typeof payload?.error === 'string') return payload.error;
            if (payload?.error?.message) return payload.error.message;
            if (payload?.message) return payload.message;
            return `API 错误: ${response.status}`;
        }

        function recordProblemActivity(activity) {
            if (!activeProblemCase) return;
            problemCaseStore.addActivity(activeProblemCase.id, activity);
        }

        async function buildContextMessageForUser(userMessage) {
            try {
                const sources = await loadMaoContextSources();
                const contexts = window.RedWisdomAIContext.findRelevantMaoContexts({
                    userMessage,
                    quotes: sources.quotes,
                    guides: sources.guides,
                    passages: sources.passages,
                    limit: 4,
                });
                const historyCases = window.RedWisdomHistoryCases.findRelevantHistoryCases({
                    userMessage,
                    cases: sources.historyCases,
                    problemTypes: sources.historyProblemTypes,
                    noAnalogyCues: sources.noAnalogyCues,
                    limit: 3,
                });
                const classification = window.RedWisdomHistoryCases.classifyProblem({
                    userMessage,
                    problemTypes: sources.historyProblemTypes,
                    noAnalogyCues: sources.noAnalogyCues,
                });
                const originalContext = contexts.length ? window.RedWisdomAIContext.buildContextMessage(contexts) : null;
                const historyContext = window.RedWisdomHistoryCases.buildHistoryContextMessage(historyCases);
                const content = [originalContext?.content, historyContext?.content].filter(Boolean).join('\n\n');
                return {
                    message: content ? { role: 'system', content } : null,
                    historyCases,
                    classification,
                };
            } catch (error) {
                console.warn('加载毛选上下文失败:', error);
                return { message: null, historyCases: [], classification: null };
            }
        }

        function loadMaoContextSources() {
            if (!maoContextSourcesPromise) {
                maoContextSourcesPromise = Promise.all([
                    fetch('data/quotes.json').then(response => response.ok ? response.json() : { quotes: [] }),
                    Promise.resolve(buildGuideContextSources()),
                    fetch('data/search-index.json').then(response => response.ok ? response.json() : { records: [] }),
                    fetch('data/history-cases.json').then(response => response.ok ? response.json() : { cases: [] }),
                    fetch('data/history-problem-types.json').then(response => response.ok ? response.json() : { types: [], noAnalogyCues: [] }),
                ]).then(([quoteData, guides, searchData, historyData, historyTypes]) => ({
                    quotes: quoteData.quotes || [],
                    guides,
                    passages: searchData.records || [],
                    historyCases: historyData.cases || [],
                    historyProblemTypes: historyTypes.types || [],
                    noAnalogyCues: historyTypes.noAnalogyCues || [],
                })).catch(() => ({
                    quotes: [],
                    guides: [],
                    passages: [],
                    historyCases: [],
                    historyProblemTypes: [],
                    noAnalogyCues: [],
                }));
            }

            return maoContextSourcesPromise;
        }

        function addHistoryMirror(contentElement, cases, classification) {
            const models = window.RedWisdomHistoryCases.buildHistoryMirrorModel(cases).slice(0, 3);
            if (!models.length) return;

            const section = document.createElement('section');
            section.className = 'history-mirror';
            section.dataset.historyMirror = 'true';
            section.setAttribute('aria-label', '党史镜鉴');

            const typeLabel = classification?.types?.[0]?.label || '相关案例';
            section.innerHTML = `
                <div class="history-mirror__label">
                    <span>党史镜鉴</span>
                    <span class="text-xs font-normal text-gray-500">${escapeHtml(typeLabel)}</span>
                </div>
            `;

            models.forEach((model) => {
                const article = document.createElement('article');
                article.className = 'history-mirror__case';
                article.innerHTML = `
                    <a class="history-mirror__title" href="${escapeHtml(model.readingHref)}">${escapeHtml(model.title)}</a>
                    <p class="history-mirror__meta">${escapeHtml(model.period)} · 当时的困境：${escapeHtml(model.challenge)}</p>
                    <p class="history-mirror__method"><strong>可迁移方法：</strong>${escapeHtml(model.transferMethod)}</p>
                    <details class="history-mirror__boundary">
                        <summary>查看类比边界</summary>
                        <p class="mt-1">${escapeHtml(model.limits)}</p>
                    </details>
                    <div class="history-mirror__links">
                        <a href="${escapeHtml(model.readingHref)}">阅读《${escapeHtml(model.articleTitle)}》原文</a>
                        ${model.authorityUrl ? `<a href="${escapeHtml(model.authorityUrl)}" target="_blank" rel="noopener noreferrer">核对党史来源</a>` : ''}
                    </div>
                `;
                section.appendChild(article);
            });

            contentElement.appendChild(section);
        }

        function buildGuideContextSources() {
            if (!window.RedWisdomReadingGuides) return [];
            const titles = new Set();
            window.RedWisdomReadingGuides.getThemeTracks().forEach(track => {
                track.articles.forEach(title => titles.add(title));
            });

            return [...titles].map(articleTitle => {
                const guide = window.RedWisdomReadingGuides.getReadingGuide(articleTitle);
                if (!guide) return null;
                return {
                    articleTitle,
                    ...guide,
                };
            }).filter(Boolean);
        }

        function inferMethodologyTags(text) {
            const tagKeywords = [
                ['实践检验', ['实践', '检验']],
                ['调查研究', ['调查', '事实']],
                ['矛盾分析', ['矛盾']],
                ['主要矛盾', ['主要矛盾']],
                ['群众路线', ['群众']],
                ['复盘', ['复盘']],
            ];

            return tagKeywords
                .filter(([, keywords]) => keywords.some(keyword => String(text || '').includes(keyword)))
                .map(([tag]) => tag);
        }

        function handleSubmittedMessage(message) {
            const session = getChatSession(chatMode);
            if (chatMode !== 'guided' || !session.coach || session.synthesisStarted) {
                sendMessage(message, { mode: chatMode });
                return;
            }

            if (session.coach.isComplete()) {
                addUserMessage(message, 'guided');
                const result = session.coach.answer(message);
                const answers = session.coach.getAnswers();
                const hesitationLabel = currentLocale === 'en' ? 'Current uncertainty' : '当前最犹豫的地方';
                session.synthesisStarted = true;
                addCoachPrompt(window.RedWisdomI18n.translate(currentLocale, 'chat.mode.guidedComplete'), null, 'guided');
                sendMessage(`${result.finalPrompt}\n${hesitationLabel}：${message}`, {
                    displayUserMessage: false,
                    conversationTitle: answers.realProblem || (currentLocale === 'en' ? 'Guided analysis' : '逐步分析'),
                    mode: 'guided',
                });
                return;
            }

            addUserMessage(message, 'guided');
            const result = session.coach.answer(message);
            if (!result.complete) {
                addCoachPrompt(result.prompt, session.coach.getProgress(), 'guided');
                return;
            }

            session.synthesisStarted = true;
            addCoachPrompt(window.RedWisdomI18n.translate(currentLocale, 'chat.mode.guidedComplete'), null, 'guided');
            const answers = session.coach.getAnswers();
            sendMessage(result.finalPrompt, {
                displayUserMessage: false,
                conversationTitle: answers.realProblem || (currentLocale === 'en' ? 'Guided analysis' : '逐步分析'),
                mode: 'guided',
            });
        }

        // ===== 事件处理 =====
        sendBtn.addEventListener('click', () => {
            // 生成中点击 = 中止回答
            if (isGenerating) {
                stopGeneration();
                return;
            }
            const message = userInput.value.trim();
            if (message) {
                userInput.value = '';
                handleSubmittedMessage(message);
            }
        });

        function stopGeneration() {
            if (!isGenerating || !activeAbortController) return;
            stoppedByUser = true;
            activeAbortController.abort();
        }

        userInput.addEventListener('keydown', (e) => {
            // 输入法组词中（如拼音确认候选词）按 Enter 不应触发发送
            if (e.isComposing || e.keyCode === 229) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                // 生成中按 Enter 不触发停止，停止只能通过点击按钮，避免误触
                if (!isGenerating) sendBtn.click();
            }
        });

        // 自动调整输入框高度
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        const initialPrompt = new URLSearchParams(window.location.search).get('prompt');
        if (initialPrompt) {
            userInput.value = initialPrompt;
            chatSessions[chatMode].draft = initialPrompt;
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        }
    </script>
</body>

</html>
