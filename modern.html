    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #BC2D22;
            border-radius: 3px;
        }

        /* Period-style filter chips */
        .period-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 9999px;
            padding: 0.375rem 0.875rem;
            font-size: 0.8125rem;
            border: 1px solid #D6C6B0;
            background: rgba(255, 255, 255, 0.7);
            color: #4b5563;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .period-tab:hover {
            border-color: #BC2D22;
            color: #BC2D22;
        }

        .period-tab.is-active {
            background: #BC2D22;
            border-color: #BC2D22;
            color: #fff;
        }

        .period-tab-count {
            border-radius: 9999px;
            background: rgba(0, 0, 0, 0.08);
            padding: 0 0.4375rem;
            font-size: 0.6875rem;
            line-height: 1.25rem;
        }

        .period-tab.is-active .period-tab-count {
            background: rgba(255, 255, 255, 0.22);
        }

        /* Cards */
        .decision-card {
            border-radius: 0.75rem;
            border: 1px solid rgba(214, 198, 176, 0.7);
            background: rgba(255, 255, 255, 0.88);
            padding: 1rem 1.125rem;
            transition: box-shadow 0.2s;
        }

        .decision-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .category-badge {
            flex: none;
            border-radius: 9999px;
            background: rgba(188, 45, 34, 0.08);
            border: 1px solid rgba(188, 45, 34, 0.35);
            color: #BC2D22;
            padding: 0.125rem 0.5625rem;
            font-size: 0.6875rem;
            font-weight: 600;
        }

        /* Toggle */
        .decision-toggle {
            margin-top: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #BC2D22;
            transition: color 0.2s;
        }

        .decision-toggle:hover {
            color: #8B1F19;
        }

        .decision-toggle-icon {
            height: 1rem;
            width: 1rem;
            transition: transform 0.2s;
        }

        .decision-toggle[aria-expanded="true"] .decision-toggle-icon {
            transform: rotate(180deg);
        }

        /* Expanded content */
        .case-detail {
            margin-top: 0.625rem;
            border-top: 1px dashed #D6C6B0;
            padding-top: 0.875rem;
        }

        .quote-block {
            border-left: 3px solid #BC2D22;
            background: rgba(188, 45, 34, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .quote-text-line {
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.7;
            color: #BC2D22;
        }

        .quote-source {
            margin-top: 0.375rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* Article chips (same look as timeline page) */
        .timeline-chip {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            border: 1px solid #BC2D22;
            color: #BC2D22;
            background: rgba(188, 45, 34, 0.06);
            padding: 0.1875rem 0.625rem;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .timeline-chip:hover {
            background: #BC2D22;
            color: #fff;
        }

        .timeline-chip-muted {
            border-color: #D6C6B0;
            color: #9ca3af;
            background: transparent;
            cursor: default;
        }

        .case-section {
            margin-top: 0.875rem;
        }

        .case-heading {
            font-size: 0.8125rem;
            font-weight: 700;
            color: #2B2B2B;
            margin-bottom: 0.375rem;
        }

        .case-list {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .case-li {
            position: relative;
            padding-left: 1.25rem;
            font-size: 0.875rem;
            line-height: 1.65;
            color: #374151;
        }

        ol.case-li,
        .case-list>li {
            counter-increment: none;
        }

        ol.case-list {
            list-style: decimal;
            padding-left: 1.25rem;
        }

        ol.case-list>.case-li {
            padding-left: 0.25rem;
        }

        ul.case-list {
            list-style: none;
            padding-left: 0;
        }

        ul.case-list>.case-li::before {
            content: "□";
            position: absolute;
            left: 0;
            color: #BC2D22;
            font-weight: 700;
        }

        .boundary-note {
            margin-top: 0.875rem;
            border-radius: 0.5rem;
            background: rgba(214, 198, 176, 0.35);
            padding: 0.5rem 0.75rem;
            font-size: 0.8125rem;
            line-height: 1.65;
            color: #57534e;
        }

        .ask-link {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            border-radius: 9999px;
            background: #BC2D22;
            color: #fff;
            padding: 0.4375rem 1rem;
            font-size: 0.8125rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .ask-link:hover {
            background: #8B1F19;
        }
    </style>
</head>
