                z-index: 30;

                padding: 0.5rem;

                display: flex;

            body.reader-chrome-hidden .reading-top-toolbar {
                transform: translateY(-100%);
            }

            body.reader-chrome-hidden .menu-btn {
                transform: translateY(calc(-100% - 1rem));
                opacity: 0;
            }

            body.reader-chrome-hidden .mobile-bottom-nav {
                transform: translateY(calc(100% + env(safe-area-inset-bottom)));
            }

            .reader-tools {
                top: auto;
                left: 0;
                width: 100%;
                height: min(72vh, 640px);
                bottom: calc(64px + env(safe-area-inset-bottom));
                border-top: 1px solid rgba(214, 198, 176, 0.75);
                border-left: 0;
                border-radius: 8px 8px 0 0;
                box-shadow: 0 -12px 32px rgba(43, 43, 43, 0.16);
                transform: translateY(100%);

            .reader-tools.is-open {
                transform: translateY(0);
            }

            .selection-excerpt-button {
                right: 0.9rem;
                bottom: calc(76px + env(safe-area-inset-bottom));

                transform: translateX(0);

        @media (min-width: 1280px) {
            .reader-tools {
                position: relative;
                top: auto;
                right: auto;
                bottom: auto;
                z-index: auto;
                display: none;
                width: 360px;
                height: 100vh;
                flex: none;
                transform: none;
                visibility: visible;
                box-shadow: none;
                transition: none;
            }

            .reader-tools.is-available:not(.is-collapsed) {
                display: flex;
            }

            .reader-tools-overlay,
            .reader-tools-overlay.is-open {
                display: none;
            }

            .selection-excerpt-button {
                right: 380px;
            }

                right: 1.25rem;
            }
        }

        }

    <script src="js/i18n.js"></script>
    <script src="js/reading-guides.js"></script>
    <script src="js/practice-store.js"></script>
    <script src="js/reading-notes-store.js"></script>
    <script src="js/reading-progress-store.js"></script>
    <script src="js/problem-case-store.js"></script>
    <script src="js/text-anchors.js"></script>
    <script src="js/full-text-search.js"></script>
    <script>
        let catalog = null;
        let allArticles = [];
        let currentArticleIndex = -1;
        let currentArticleMeta = null;
        let searchIndexPromise = null;
        let lastSelectedArticleText = '';
        let activeReadingToolTab = 'notes';
        let readerToolsCollapsed = false;
        let currentLocale = window.RedWisdomI18n?.getStoredLocale(localStorage) || 'zh-CN';
        const READING_FONT_SIZE_KEY = 'redwisdom.readingFontSize.v1';
        const DEFAULT_READING_FONT_SIZE = 18;
        const MIN_READING_FONT_SIZE = 15;
        const MAX_READING_FONT_SIZE = 24;
        let readingFontSize = getStoredReadingFontSize();
        const practiceStore = window.RedWisdomPractice.createPracticeStore(localStorage);
        const readingNotesStore = window.RedWisdomReadingNotes.createReadingNotesStore(localStorage);
        const problemCaseStore = window.RedWisdomProblemCases.createProblemCaseStore(localStorage);
        const problemCaseId = new URLSearchParams(window.location.search).get('case') || '';
        const activeProblemCase = problemCaseId ? problemCaseStore.getCase(problemCaseId) : null;
        const readingProgressStore = window.RedWisdomReadingProgress.createReadingProgressStore(localStorage);

        if (activeProblemCase) {
            const contextBar = document.getElementById('problemContextBar');
            contextBar.classList.remove('hidden');
            contextBar.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div><span class="text-gray-500">正在为这个问题阅读：</span><strong>${escapeHtml(activeProblemCase.title)}</strong></div>
                    <a class="text-china-red hover:underline" href="problems.html?id=${encodeURIComponent(activeProblemCase.id)}">返回问题工作台</a>
                </div>
            `;
        }

        initializeSearch();
        loadEditionNotice();

        // Load catalog data
        async function loadCatalog() {
            try {
                const response = await fetch('data/catalog.json');
                catalog = await response.json();

                // Flatten all articles for navigation
                Object.values(catalog.volumes).forEach(articles => {
                    allArticles = allArticles.concat(articles);
                });

                renderCatalogCount();

                renderVolumeList();
                renderThemeTracks();

                // Check URL hash for direct article link
                const params = new URLSearchParams(window.location.search);
                const linkedArticle = params.get('article');
                const linkedAnchor = params.get('anchor');
                if (linkedArticle) {
                    loadArticle(linkedArticle, linkedAnchor);
                } else if (window.location.hash) {
                    const filename = decodeURIComponent(window.location.hash.slice(1));
                    loadArticle(filename);
                }
            } catch (error) {
                console.error('Failed to load catalog:', error);
            }
        }

        // Render volume list in sidebar
        function renderVolumeList() {
            const container = document.getElementById('volumeList');
            let html = '';

            Object.entries(catalog.volumes).forEach(([volumeName, articles], idx) => {
                html += `
                    <div class="volume-section">
                        <button type="button" class="volume-title flex items-center gap-2 px-4 py-3 text-gray-200 font-medium" data-volume-toggle="${idx}" aria-expanded="false" aria-controls="volume-${idx}">
                            <svg id="arrow-${idx}" class="transform transition-transform" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 18l6-6-6-6"/>
                            </svg>
                            <span>${volumeName}</span>
                            <span class="text-gray-500 text-xs ml-auto">${articles.length}篇</span>
                        </button>
                        <div id="volume-${idx}" class="volume-articles">
                            ${articles.map(article => `
                                <button type="button" class="article-item" data-filename="${escapeAttribute(article.filename)}">
                                    ${escapeHtml(article.title)}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.querySelectorAll('[data-volume-toggle]').forEach(button => {
                button.addEventListener('click', () => toggleVolume(Number(button.dataset.volumeToggle)));
            });
            container.querySelectorAll('.article-item[data-filename]').forEach(button => {
                button.addEventListener('click', () => loadArticle(button.dataset.filename));
            });
        }

        function renderThemeTracks() {
            const container = document.getElementById('themeTracks');
            if (!container || !window.RedWisdomReadingGuides) return;

            const titleToArticle = new Map(allArticles.map(article => [article.title, article]));

            container.innerHTML = window.RedWisdomReadingGuides.getThemeTracks(currentLocale).map(track => `
                <div class="theme-track-card${track.featured ? ' theme-track-card-featured' : ''}">
                    <h2>${escapeHtml(track.title)}</h2>
                    <p>${escapeHtml(track.description)}</p>
                    <div>
                        ${track.articles.map(title => {
                const article = titleToArticle.get(title);
                if (!article) return '';
                return `<button type="button" data-filename="${escapeAttribute(article.filename)}">${escapeHtml(title)}</button>`;
            }).join('')}
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('button[data-filename]').forEach(button => {
                button.addEventListener('click', () => loadArticle(button.dataset.filename));
            });
        }

        // Toggle volume expansion
        function toggleVolume(idx) {
            const volumeEl = document.getElementById(`volume-${idx}`);
            const arrowEl = document.getElementById(`arrow-${idx}`);

            volumeEl.classList.toggle('expanded');
            arrowEl.style.transform = volumeEl.classList.contains('expanded') ? 'rotate(90deg)' : '';
            document.querySelector(`[data-volume-toggle="${idx}"]`)?.setAttribute('aria-expanded', String(volumeEl.classList.contains('expanded')));
        }

        // Load article content
        async function loadArticle(filename, targetAnchor = '') {
            const welcomeEl = document.getElementById('welcomeMessage');
            const loadingEl = document.getElementById('loadingState');
            const bodyEl = document.getElementById('articleBody');
            const navEl = document.getElementById('navFooter');

            // Show loading
            welcomeEl.classList.add('hidden');
            bodyEl.classList.add('hidden');
            navEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');

            try {
                const response = await fetch(`data/articles/${encodeURIComponent(filename)}`);
                if (!response.ok) throw new Error('Article not found');

                const markdown = await response.text();
                const html = DOMPurify.sanitize(marked.parse(markdown));
                const articleMeta = allArticles.find(article => article.filename === filename);
                const guide = window.RedWisdomReadingGuides?.getReadingGuide(articleMeta?.title, currentLocale);
                currentArticleMeta = articleMeta || null;
                recordReadingProgress(articleMeta, 5, 0);

                lastSelectedArticleText = '';
                document.getElementById('selectionExcerptButton').classList.add('hidden');
                bodyEl.innerHTML = `${renderReadingGuide(guide)}${html}`;
                const articleRoot = bodyEl.querySelector(':scope > h1')?.parentElement || bodyEl;
                window.RedWisdomTextAnchors.assignTextAnchors(articleRoot);
                renderReadingTools(articleMeta);
                attachGuidePracticeAction(articleMeta, guide);
                attachReadingNoteAction(articleMeta);
                attachReadingActivityAction(articleMeta);
                bodyEl.classList.remove('hidden');
                loadingEl.classList.add('hidden');
                navEl.classList.remove('hidden');

                // Keep exact search links shareable; ordinary catalog navigation uses the shorter hash form.
                const nextUrl = new URL(window.location.href);
                if (targetAnchor) {
                    nextUrl.searchParams.set('article', filename);
                    nextUrl.searchParams.set('anchor', targetAnchor);
                    nextUrl.hash = '';
                } else {
                    nextUrl.searchParams.delete('article');
                    nextUrl.searchParams.delete('anchor');
                    nextUrl.hash = filename;
                }
                window.history.replaceState({}, '', nextUrl);

                // Update active state in sidebar
                document.querySelectorAll('.article-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.filename === filename);
                });

                // Find current index for navigation
                currentArticleIndex = allArticles.findIndex(a => a.filename === filename);
                updateNavButtons();

                // Expand the containing volume
                expandContainingVolume(filename);

                // Scroll to top
                document.querySelector('main').scrollTo(0, 0);
                showReadingChrome();
                closeReadingFontMenu();
                if (targetAnchor) {
                    window.requestAnimationFrame(() => {
                        const target = document.getElementById(targetAnchor);
                        target?.classList.add('reading-anchor-target');
                        target?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    });
                }

                // Close sidebar on mobile
                if (window.innerWidth < 768) {
                    document.getElementById('sidebar').classList.add('collapsed');
                    document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
                }

            } catch (error) {
                console.error('Failed to load article:', error);
                bodyEl.innerHTML = `<p class="text-center text-red-600 py-20">${escapeHtml(t('reading.loadFailed'))}</p>`;
                bodyEl.classList.remove('hidden');
                loadingEl.classList.add('hidden');
            }
        }

        function initializeSearch() {
            const input = document.getElementById('readingSearchInput');
            const status = document.getElementById('readingSearchStatus');
            let timer = null;

            input.addEventListener('input', () => {
                window.clearTimeout(timer);
                const query = input.value.trim();
                if (query.length < 2) {
                    status.textContent = query ? '请至少输入两个字。' : '';
                    renderSearchResults([]);
                    return;
                }
                status.textContent = '正在搜索原文...';
                timer = window.setTimeout(async () => {
                    try {
                        const records = await loadSearchIndex();
                        const results = window.RedWisdomFullTextSearch.searchIndex(records, query, 18);
                        status.textContent = results.length ? `找到 ${results.length} 条相关段落` : '未找到相关段落';
                        renderSearchResults(results);
                    } catch (error) {
                        status.textContent = '搜索索引加载失败，请稍后重试。';
                    }
                }, 180);
            });
        }

        function loadSearchIndex() {
            if (!searchIndexPromise) {
                searchIndexPromise = fetch('data/search-index.json')
                    .then(response => {
                        if (!response.ok) throw new Error('Search index unavailable');
                        return response.json();
                    })
                    .then(payload => payload.records || []);
            }
            return searchIndexPromise;
        }

        function renderSearchResults(results) {
            const container = document.getElementById('readingSearchResults');
            if (!results.length) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }
            container.classList.remove('hidden');
            container.innerHTML = results.map(result => {
                const params = new URLSearchParams({ article: result.articleId, anchor: result.anchor });
                if (problemCaseId) params.set('case', problemCaseId);
                return `
                    <a href="reading.html?${params.toString()}" data-search-article="${escapeAttribute(result.articleId)}" data-search-anchor="${escapeAttribute(result.anchor)}" class="mb-2 block rounded border border-gray-700 bg-white/5 px-3 py-2 hover:border-china-red">
                        <strong class="block text-sm text-white">${escapeHtml(result.title)}</strong>
                        <span class="mt-1 block text-xs leading-relaxed text-gray-400">${escapeHtml(result.snippet)}</span>
                    </a>
                `;
            }).join('');
            container.querySelectorAll('[data-search-article]').forEach(link => {
                link.addEventListener('click', event => {
                    event.preventDefault();
                    loadArticle(link.dataset.searchArticle, link.dataset.searchAnchor);
                });
            });
        }

        async function loadEditionNotice() {
            try {
                const response = await fetch('data/text-edition.json');
                const edition = await response.json();
                document.getElementById('editionNotice').innerHTML = `
                    <strong class="text-gray-200">${escapeHtml(edition.displayName)}</strong>
                    <p class="mt-1">${escapeHtml(edition.notice)}</p>
                    <p class="mt-1 text-china-red">${escapeHtml(edition.verificationStatus)}</p>
                `;
            } catch (error) {
                document.getElementById('editionNotice').textContent = '版本信息暂时无法读取。';
            }
        }

        // Expand the volume containing the current article
        function expandContainingVolume(filename) {
            let volumeIdx = 0;
            for (const [volumeName, articles] of Object.entries(catalog.volumes)) {
                if (articles.some(a => a.filename === filename)) {
                    const volumeEl = document.getElementById(`volume-${volumeIdx}`);
                    const arrowEl = document.getElementById(`arrow-${volumeIdx}`);
                    volumeEl.classList.add('expanded');
                    arrowEl.style.transform = 'rotate(90deg)';
                    document.querySelector(`[data-volume-toggle="${volumeIdx}"]`)?.setAttribute('aria-expanded', 'true');
                    break;
                }
                volumeIdx++;
            }
        }

        // Update navigation buttons
        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const prevTitle = document.getElementById('prevTitle');
            const nextTitle = document.getElementById('nextTitle');

            if (currentArticleIndex > 0) {
                prevBtn.disabled = false;
                prevBtn.classList.remove('opacity-30');
                prevTitle.textContent = allArticles[currentArticleIndex - 1].title;
            } else {
                prevBtn.disabled = true;
                prevBtn.classList.add('opacity-30');
                prevTitle.textContent = t('reading.firstArticle');
            }

            if (currentArticleIndex < allArticles.length - 1) {
                nextBtn.disabled = false;
                nextBtn.classList.remove('opacity-30');
                nextTitle.textContent = allArticles[currentArticleIndex + 1].title;
            } else {
                nextBtn.disabled = true;
                nextBtn.classList.add('opacity-30');
                nextTitle.textContent = t('reading.lastArticle');
            }
        }

        function loadPrevArticle() {
            if (currentArticleIndex > 0) {
                loadArticle(allArticles[currentArticleIndex - 1].filename);
            }
        }

        function loadNextArticle() {
            if (currentArticleIndex < allArticles.length - 1) {
                loadArticle(allArticles[currentArticleIndex + 1].filename);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const collapsed = sidebar.classList.toggle('collapsed');
            document.getElementById('menuBtn').setAttribute('aria-expanded', String(!collapsed));
            if (!collapsed) showReadingChrome();
        }

        function renderReadingGuide(guide) {
            if (!guide) return '';

            return `
                <section class="reading-guide">
                    <h2>${escapeHtml(t('reading.guideTitle'))}</h2>
                    <p><strong>${labelText('reading.problem')}</strong>${escapeHtml(guide.problem)}</p>
                    <p><strong>${labelText('reading.background')}</strong>${escapeHtml(guide.background)}</p>
                    <div class="reading-guide-grid">
                        ${renderGuideList(t('reading.coreIdeas'), guide.coreIdeas)}
                        ${renderGuideList(t('reading.scenarios'), guide.scenarios)}
                        ${renderGuideList(t('reading.questions'), guide.questions)}
                    </div>
                    <p class="mt-4"><strong>${labelText('reading.practice')}</strong>${escapeHtml(guide.practice)}</p>
                    <button type="button" data-action="guide-practice" class="mt-4 px-4 py-2 bg-china-red text-white rounded hover:bg-red-800">${escapeHtml(t('reading.savePractice'))}</button>
                </section>
            `;
        }

        function attachGuidePracticeAction(articleMeta, guide) {
            const button = document.querySelector('[data-action="guide-practice"]');
            if (!button || !articleMeta || !guide) return;

            button.addEventListener('click', () => {
                const draft = window.RedWisdomPractice.buildPracticeDraftFromGuide(articleMeta.title, guide);
                draft.sourceHref = `reading.html#${encodeURIComponent(articleMeta.filename)}`;
                draft.problemCaseId = problemCaseId;
                const practice = practiceStore.createPractice(draft);
                recordProblemActivity({
                    type: 'practice',
                    referenceId: practice.id,
                    title: practice.title,
                    detail: practice.actionPlan,
                    sourceHref: `practice.html#${encodeURIComponent(practice.id)}`,
                });
                window.location.href = problemCaseId ? `practice.html?case=${encodeURIComponent(problemCaseId)}#${encodeURIComponent(practice.id)}` : 'practice.html';
            });
        }

        function renderReadingTools(articleMeta) {
            const tools = document.getElementById('readerTools');
            const toolsBody = document.getElementById('readerToolsBody');
            const toolControls = document.getElementById('readingToolControls');
            if (!articleMeta || !tools || !toolsBody || !toolControls) return;

            const note = readingNotesStore.getNoteForArticle(articleMeta.filename);
            const progress = readingProgressStore.getProgressForArticle(articleMeta.filename);
            const highlights = readingProgressStore.listHighlightsForArticle(articleMeta.filename);
            const bookmarkText = progress?.bookmarked ? t('reading.bookmarked') : t('reading.bookmarkArticle');

            document.getElementById('readerToolsArticleTitle').textContent = `《${articleMeta.title}》`;
            toolsBody.innerHTML = `
                <section id="readingNotesPanel" data-reading-tool-panel="notes" role="tabpanel">
                    <div class="mb-4 flex flex-wrap items-center gap-2 text-sm text-gray-600">
                        <span>${labelText('reading.progress')}${progress?.progressPercent || 0}%</span>
                        <button type="button" id="bookmarkArticleBtn" class="px-3 py-1 border border-dark-beige rounded hover:bg-dark-beige/20">${bookmarkText}</button>
                    </div>
                    <p class="text-sm leading-relaxed text-gray-600">${escapeHtml(t('reading.noteHelp'))}</p>
                    <textarea id="readingNoteInput" class="reader-tool-textarea mt-3 min-h-[220px]" placeholder="${escapeAttribute(t('reading.notePlaceholder'))}">${escapeHtml(note?.content || '')}</textarea>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button type="button" id="saveReadingNoteBtn" class="px-4 py-2 bg-china-red text-white rounded hover:bg-red-800">${escapeHtml(t('reading.saveNote'))}</button>
                        <button type="button" id="deleteReadingNoteBtn" class="px-4 py-2 border border-dark-beige rounded hover:bg-dark-beige/20">${escapeHtml(t('reading.deleteNote'))}</button>
                        <a href="me.html" class="px-4 py-2 border border-dark-beige rounded hover:bg-dark-beige/20">${escapeHtml(t('reading.viewArchive'))}</a>
                    </div>
                    <p id="readingNoteStatus" class="mt-2 min-h-5 text-sm text-gray-600" aria-live="polite"></p>
                </section>
                <section id="readingExcerptsPanel" class="hidden" data-reading-tool-panel="excerpts" role="tabpanel">
                    <p class="text-sm leading-relaxed text-gray-600">${escapeHtml(t('reading.excerptsHelp'))}</p>
                    <div class="mt-4">
                        <p class="mb-2 text-xs font-bold text-gray-500">${escapeHtml(t('reading.currentSelection'))}</p>
                        <blockquote id="selectedTextPreview" class="selected-text-preview">${escapeHtml(t('reading.noSelection'))}</blockquote>
                    </div>
                    <textarea id="highlightNoteInput" class="reader-tool-textarea mt-3 min-h-[90px]" placeholder="${escapeAttribute(t('reading.highlightPlaceholder'))}"></textarea>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button type="button" id="saveHighlightBtn" class="px-4 py-2 bg-china-red text-white rounded hover:bg-red-800">${escapeHtml(t('reading.saveHighlight'))}</button>
                    </div>
                    <p id="highlightStatus" class="mt-2 min-h-5 text-sm text-gray-600" aria-live="polite"></p>
                    <div class="mt-5 border-t border-dark-beige/60 pt-3">
                        <div id="highlightList">${renderHighlightList(highlights)}</div>
                    </div>
                </section>
            `;

            toolControls.classList.remove('hidden');
            toolControls.classList.add('flex');
            tools.classList.add('is-available');
            updateReadingToolCounts(note, highlights);

            if (window.matchMedia('(min-width: 1280px)').matches && !readerToolsCollapsed) {
                tools.classList.remove('is-collapsed');
                tools.setAttribute('aria-hidden', 'false');
                tools.inert = false;
            } else {
                tools.classList.remove('is-open');
                tools.setAttribute('aria-hidden', 'true');
                tools.inert = true;
                document.getElementById('readerToolsOverlay').classList.remove('is-open');
            }
            setReadingToolTab(activeReadingToolTab);
        }

        function setupReadingTools() {
            document.getElementById('openReadingNotesBtn')?.addEventListener('click', () => openReadingTools('notes'));
            document.getElementById('openReadingExcerptsBtn')?.addEventListener('click', () => openReadingTools('excerpts'));
            document.getElementById('closeReaderToolsBtn')?.addEventListener('click', closeReadingTools);
            document.getElementById('readerToolsOverlay')?.addEventListener('click', closeReadingTools);
            document.getElementById('selectionExcerptButton')?.addEventListener('click', () => openReadingTools('excerpts'));

            document.querySelectorAll('[data-reading-tool-tab]').forEach(button => {
                button.addEventListener('click', () => setReadingToolTab(button.dataset.readingToolTab));
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && document.getElementById('readerTools')?.classList.contains('is-open')) {
                    closeReadingTools();
                }
            });
            window.addEventListener('resize', syncReaderToolsForViewport);
        }

        function openReadingTools(tabName) {
            const tools = document.getElementById('readerTools');
            if (!currentArticleMeta || !tools?.classList.contains('is-available')) return;

            showReadingChrome();
            closeReadingFontMenu();
            readerToolsCollapsed = false;
            tools.classList.remove('is-collapsed');
            tools.classList.add('is-open');
            tools.setAttribute('aria-hidden', 'false');
            tools.inert = false;
            setReadingToolTab(tabName);

            const isWideDesktop = window.matchMedia('(min-width: 1280px)').matches;
            document.getElementById('readerToolsOverlay').classList.toggle('is-open', !isWideDesktop);
        }

        function closeReadingTools() {
            const tools = document.getElementById('readerTools');
            if (!tools) return;

            const isWideDesktop = window.matchMedia('(min-width: 1280px)').matches;
            tools.classList.remove('is-open');
            if (isWideDesktop) {
                readerToolsCollapsed = true;
                tools.classList.add('is-collapsed');
            }
            tools.setAttribute('aria-hidden', 'true');
            tools.inert = true;
            document.getElementById('readerToolsOverlay').classList.remove('is-open');
            document.getElementById('openReadingNotesBtn')?.setAttribute('aria-pressed', 'false');
            document.getElementById('openReadingExcerptsBtn')?.setAttribute('aria-pressed', 'false');
        }

        function syncReaderToolsForViewport() {
            const tools = document.getElementById('readerTools');
            if (!tools?.classList.contains('is-available')) return;

            if (window.matchMedia('(min-width: 1280px)').matches) {
                tools.classList.remove('is-open');
                document.getElementById('readerToolsOverlay').classList.remove('is-open');
                tools.setAttribute('aria-hidden', String(readerToolsCollapsed));
                tools.inert = readerToolsCollapsed;
            } else {
                tools.classList.remove('is-collapsed');
                tools.setAttribute('aria-hidden', String(!tools.classList.contains('is-open')));
                tools.inert = !tools.classList.contains('is-open');
            }
            setReadingToolTab(activeReadingToolTab);
        }

        function setReadingToolTab(tabName) {
            activeReadingToolTab = tabName === 'excerpts' ? 'excerpts' : 'notes';
            document.querySelectorAll('[data-reading-tool-tab]').forEach(button => {
                const active = button.dataset.readingToolTab === activeReadingToolTab;
                button.classList.toggle('is-active', active);
                button.setAttribute('aria-selected', String(active));
            });
            document.querySelectorAll('[data-reading-tool-panel]').forEach(panel => {
                panel.classList.toggle('hidden', panel.dataset.readingToolPanel !== activeReadingToolTab);
            });

            const toolsVisible = document.getElementById('readerTools')?.getAttribute('aria-hidden') === 'false';
            document.getElementById('openReadingNotesBtn')?.setAttribute('aria-pressed', String(toolsVisible && activeReadingToolTab === 'notes'));
            document.getElementById('openReadingExcerptsBtn')?.setAttribute('aria-pressed', String(toolsVisible && activeReadingToolTab === 'excerpts'));
            if (activeReadingToolTab === 'excerpts') updateSelectedTextPreview();
        }

        function updateReadingToolCounts(note, highlights) {
            const currentNote = note === undefined && currentArticleMeta
                ? readingNotesStore.getNoteForArticle(currentArticleMeta.filename)
                : note;
            const currentHighlights = highlights === undefined && currentArticleMeta
                ? readingProgressStore.listHighlightsForArticle(currentArticleMeta.filename)
                : highlights;
            document.getElementById('readingNoteCount').textContent = currentNote?.content?.trim() ? '1' : '0';
            document.getElementById('readingExcerptCount').textContent = String(currentHighlights?.length || 0);
        }

        function updateSelectedTextPreview() {
            const preview = document.getElementById('selectedTextPreview');
            if (preview) preview.textContent = lastSelectedArticleText || t('reading.noSelection');
        }

        function attachReadingNoteAction(articleMeta) {
            const input = document.getElementById('readingNoteInput');
            const saveButton = document.getElementById('saveReadingNoteBtn');
            const deleteButton = document.getElementById('deleteReadingNoteBtn');
            const status = document.getElementById('readingNoteStatus');
            if (!articleMeta || !input || !saveButton || !deleteButton || !status) return;

            saveButton.addEventListener('click', () => {
                readingNotesStore.upsertNote({
                    articleId: articleMeta.filename,
                    articleTitle: articleMeta.title,
                    content: input.value,
                    problemCaseId,
                });
                recordProblemActivity({
                    type: 'note',
                    referenceId: articleMeta.filename,
                    title: `阅读笔记：《${articleMeta.title}》`,
                    detail: input.value.slice(0, 500),
                    sourceHref: `reading.html?case=${encodeURIComponent(problemCaseId)}#${encodeURIComponent(articleMeta.filename)}`,
                });
                status.textContent = t('reading.noteSaved');
                updateReadingToolCounts();
            });

            deleteButton.addEventListener('click', () => {
                readingNotesStore.deleteNoteForArticle(articleMeta.filename);
                input.value = '';
                status.textContent = t('reading.noteDeleted');
                updateReadingToolCounts();
            });
        }

        function recordProblemActivity(activity) {
            if (!activeProblemCase) return;
            problemCaseStore.addActivity(activeProblemCase.id, activity);
        }

        function attachReadingActivityAction(articleMeta) {
            const bookmarkButton = document.getElementById('bookmarkArticleBtn');
            const highlightButton = document.getElementById('saveHighlightBtn');
            const highlightNoteInput = document.getElementById('highlightNoteInput');
            const highlightStatus = document.getElementById('highlightStatus');
            const highlightList = document.getElementById('highlightList');
            const noteStatus = document.getElementById('readingNoteStatus');
            if (!articleMeta || !bookmarkButton || !highlightButton || !highlightNoteInput || !highlightStatus || !highlightList || !noteStatus) return;

            bookmarkButton.addEventListener('click', () => {
                const updated = readingProgressStore.toggleBookmark({
                    articleId: articleMeta.filename,
                    articleTitle: articleMeta.title,
                });
                bookmarkButton.textContent = updated.bookmarked ? t('reading.bookmarked') : t('reading.bookmarkArticle');
                noteStatus.textContent = updated.bookmarked ? t('reading.bookmarkSaved') : t('reading.bookmarkRemoved');
            });

            highlightButton.addEventListener('click', () => {
                const selectedText = String(window.getSelection()?.toString() || '').trim() || lastSelectedArticleText;
                if (!selectedText) {
                    highlightStatus.textContent = t('reading.selectTextFirst');
                    return;
                }

                readingProgressStore.addHighlight({
                    articleId: articleMeta.filename,
                    articleTitle: articleMeta.title,
                    selectedText,
                    note: highlightNoteInput.value,
                });
                highlightNoteInput.value = '';
                lastSelectedArticleText = '';
                window.getSelection()?.removeAllRanges();
                highlightStatus.textContent = t('reading.highlightSaved');
                highlightList.innerHTML = renderHighlightList(readingProgressStore.listHighlightsForArticle(articleMeta.filename));
                document.getElementById('selectionExcerptButton').classList.add('hidden');
                updateSelectedTextPreview();
                updateReadingToolCounts();
                attachHighlightDeleteActions(articleMeta);
            });

            attachHighlightDeleteActions(articleMeta);
        }

        function attachHighlightDeleteActions(articleMeta) {
            document.querySelectorAll('[data-action="delete-highlight"]').forEach(button => {
                button.addEventListener('click', () => {
                    readingProgressStore.deleteHighlight(button.dataset.id);
                    document.getElementById('highlightList').innerHTML = renderHighlightList(
                        readingProgressStore.listHighlightsForArticle(articleMeta.filename)
                    );
                    updateReadingToolCounts();
                    attachHighlightDeleteActions(articleMeta);
                });
            });
        }

        function renderHighlightList(highlights) {
            if (!highlights.length) {
                return `<p class="text-sm text-gray-600">${escapeHtml(t('reading.noHighlights'))}</p>`;
            }

            return highlights.map(highlight => `
                <article class="border-t border-dark-beige/60 py-3 first:border-t-0">
                    <p class="font-serif text-sm leading-relaxed">${escapeHtml(highlight.selectedText)}</p>
                    ${highlight.note ? `<p class="mt-2 text-sm text-gray-600">${escapeHtml(highlight.note)}</p>` : ''}
                    <button type="button" data-action="delete-highlight" data-id="${escapeAttribute(highlight.id)}" class="mt-2 text-sm text-china-red hover:underline">${escapeHtml(t('reading.deleteHighlight'))}</button>
                </article>
            `).join('');
        }

        function recordReadingProgress(articleMeta, percent, lastPosition) {
            if (!articleMeta) return;
            const existing = readingProgressStore.getProgressForArticle(articleMeta.filename);
            readingProgressStore.upsertProgress({
                articleId: articleMeta.filename,
                articleTitle: articleMeta.title,
                progressPercent: Math.max(existing?.progressPercent || 0, percent),
                lastPosition,
            });
        }

        function updateCurrentReadingProgress() {
            if (!currentArticleMeta) return;
            const mainEl = document.querySelector('main');
            const maxScroll = mainEl.scrollHeight - mainEl.clientHeight;
            if (maxScroll <= 0) return;
            const percent = Math.min(100, Math.max(5, Math.round((mainEl.scrollTop / maxScroll) * 100)));
            recordReadingProgress(currentArticleMeta, percent, mainEl.scrollTop);
        }

        function rememberArticleSelection() {
            const selection = window.getSelection();
            const selectedText = String(selection?.toString() || '').trim();
            const articleBody = document.getElementById('articleBody');
            if (!selectedText || !articleBody || !selection?.anchorNode || !articleBody.contains(selection.anchorNode)) {
                return;
            }

            lastSelectedArticleText = selectedText;
            updateSelectedTextPreview();
            document.getElementById('selectionExcerptButton').classList.remove('hidden');
        }

        function renderGuideList(title, items) {
            return `
                <div class="reading-guide-section">
                    <strong>${escapeHtml(title)}</strong>
                    <ul>
                        ${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        function t(key) {
            return window.RedWisdomI18n?.translate(currentLocale, key) || key;
        }

        function labelText(key) {
            const colon = currentLocale === 'en' ? ': ' : '：';
            return `${escapeHtml(t(key))}${colon}`;
        }

        function setupLocaleControls() {
            const localeSelect = document.getElementById('readingLocaleSelect');
            if (!localeSelect || !window.RedWisdomI18n) return;

            localeSelect.value = currentLocale;
            window.RedWisdomI18n.applyTranslations(document, currentLocale);
            localeSelect.addEventListener('change', () => {
                currentLocale = window.RedWisdomI18n.setStoredLocale(localStorage, localeSelect.value);
                localeSelect.value = currentLocale;
                window.RedWisdomI18n.applyTranslations(document, currentLocale);
                renderCatalogCount();
                renderThemeTracks();

                if (currentArticleMeta?.filename) {
                    loadArticle(currentArticleMeta.filename);
                }
            });
        }

        function renderCatalogCount() {
            if (!catalog) return;
            const volumeCount = Object.keys(catalog.volumes).length;
            document.getElementById('catalogCount').textContent = currentLocale === 'en'
                ? `${volumeCount} volumes · ${allArticles.length} articles`
                : `共 ${volumeCount} 卷 · ${allArticles.length} 篇`;
        }

        function setupReadingFontSizeControls() {
            const decreaseButton = document.getElementById('readingFontDecrease');
            const resetButton = document.getElementById('readingFontReset');
            const increaseButton = document.getElementById('readingFontIncrease');
            const menuButton = document.getElementById('readingFontMenuButton');
            const controls = document.getElementById('readingFontControls');

            applyReadingFontSize();

            decreaseButton?.addEventListener('click', () => setReadingFontSize(readingFontSize - 1));
            resetButton?.addEventListener('click', () => setReadingFontSize(DEFAULT_READING_FONT_SIZE));
            increaseButton?.addEventListener('click', () => setReadingFontSize(readingFontSize + 1));
            menuButton?.addEventListener('click', event => {
                event.stopPropagation();
                showReadingChrome();
                const popover = document.getElementById('readingFontPopover');
                const isOpen = popover?.classList.toggle('is-open') || false;
                menuButton.setAttribute('aria-expanded', String(isOpen));
            });
            document.addEventListener('click', event => {
                if (!controls?.contains(event.target)) closeReadingFontMenu();
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') closeReadingFontMenu();
            });
        }

        function closeReadingFontMenu() {
            document.getElementById('readingFontPopover')?.classList.remove('is-open');
            document.getElementById('readingFontMenuButton')?.setAttribute('aria-expanded', 'false');
        }

        function showReadingChrome() {
            document.body.classList.remove('reader-chrome-hidden');
        }

        function setupMobileReadingChrome() {
            const mainEl = document.getElementById('readingMain');
            if (!mainEl) return;

            let lastScrollTop = mainEl.scrollTop;
            mainEl.addEventListener('scroll', () => {
                if (!window.matchMedia('(max-width: 640px)').matches || !currentArticleMeta) {
                    showReadingChrome();
                    lastScrollTop = mainEl.scrollTop;
                    return;
                }

                const scrollTop = mainEl.scrollTop;
                const delta = scrollTop - lastScrollTop;
                const sidebarOpen = !document.getElementById('sidebar')?.classList.contains('collapsed');
                const toolsOpen = document.getElementById('readerTools')?.classList.contains('is-open');
                const fontMenuOpen = document.getElementById('readingFontPopover')?.classList.contains('is-open');

                if (scrollTop <= 72 || delta < -4) {
                    showReadingChrome();
                } else if (scrollTop > 160 && delta > 4 && !sidebarOpen && !toolsOpen && !fontMenuOpen) {
                    document.body.classList.add('reader-chrome-hidden');
                }
                lastScrollTop = scrollTop;
            }, { passive: true });

            window.addEventListener('resize', () => {
                if (!window.matchMedia('(max-width: 640px)').matches) showReadingChrome();
            });
        }

        function getStoredReadingFontSize() {
            const value = localStorage.getItem(READING_FONT_SIZE_KEY);
            if (value === null) return DEFAULT_READING_FONT_SIZE;
            return clampReadingFontSize(value);
        }

        function setReadingFontSize(value) {
            readingFontSize = clampReadingFontSize(value);
            localStorage.setItem(READING_FONT_SIZE_KEY, String(readingFontSize));
            applyReadingFontSize();
        }

        function applyReadingFontSize() {
            const article = document.getElementById('articleContent');
            const label = document.getElementById('readingFontSizeLabel');
            if (article) {
                article.style.setProperty('--reading-font-size', `${readingFontSize}px`);
            }
            if (label) {
                label.textContent = `${readingFontSize}px`;
            }
        }

        function clampReadingFontSize(value) {
            const number = Number(value);
            if (!Number.isFinite(number)) return DEFAULT_READING_FONT_SIZE;
            return Math.min(MAX_READING_FONT_SIZE, Math.max(MIN_READING_FONT_SIZE, Math.round(number)));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function escapeAttribute(text) {
            return escapeHtml(text).replace(/"/g, '&quot;');
        }

        // Initialize
        setupLocaleControls();
        setupReadingFontSizeControls();
        setupReadingTools();
        setupMobileReadingChrome();
        loadCatalog();
        document.querySelector('main').addEventListener('scroll', updateCurrentReadingProgress, { passive: true });
        document.addEventListener('selectionchange', rememberArticleSelection);
    </script>
</body>

</html>
